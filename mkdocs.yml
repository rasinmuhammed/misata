site_name: Misata
site_description: Declarative synthetic data generator for Python. State the facts a dataset must hold and get multi-table data from SQL DDL, YAML, a live database or a sentence that holds them exactly, with a DuckDB certificate anyone can rerun.
site_url: https://rasinmuhammed.github.io/misata
repo_url: https://github.com/rasinmuhammed/misata
repo_name: rasinmuhammed/misata
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - assets/custom.css

plugins:
  - search
  - meta

# Cross-domain canonicalization: pages duplicated on misata.studio/docs point
# their canonical there so ranking signals consolidate on the brand domain.
hooks:
  - docs_seo_hook.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html

