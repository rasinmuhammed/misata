# Reference data bundled with Misata. Every file here is derived from an
# openly licensed source, records that source, and is regenerated by a script
# rather than edited by hand. Nothing here is a row of anyone's private data.

[city_population]
file = "city_population.json"
what = "Population of each city named in Misata's own city lists (CITIES_BY_COUNTRY, the US geography map, locale packs' top cities), used to weight which city a row lands in."
source = "GeoNames cities15000, via the geonamescache 3.0.2 package"
url = "https://www.geonames.org"
licence = "CC BY 4.0 (GeoNames data); geonamescache code is MIT"
attribution = "Contains data from GeoNames (https://www.geonames.org), licensed under CC BY 4.0."
retrieved = "2026-10-03"
transform = "Matched by country and ASCII-folded name (including GeoNames alternate names); kept the largest population per name. Only cities already in Misata's lists are kept (336 cities, 22 countries)."
