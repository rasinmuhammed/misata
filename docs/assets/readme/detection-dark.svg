<text x="200" y="128" font-size="10.5" text-anchor="end" fill="#c3c2b7">sees no real data</text>
<circle cx="493.9" cy="108" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="502.9" y="112" font-size="10.5" fill="#c3c2b7">0.73</text>
<circle cx="580.4" cy="120" r="5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="589.4" y="124" font-size="10.5" fill="#c3c2b7">0.80</text>
