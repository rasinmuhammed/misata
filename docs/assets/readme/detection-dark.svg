<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">How easily a classifier tells generated data from real</title>
<desc id="d">Detection AUC, mean of five seeds; 0.5 means indistinguishable. Misata, declared schema: Olist 0.63, taxi 0.75; Misata, from a sentence: Olist 0.73, taxi 0.80; Faker script: Olist 0.78, taxi 0.79; SDV, fitted to the real data: Olist 0.71, taxi 0.68; Misata mimic, fitted: Olist 0.54, taxi 0.54.</desc>
<rect width="680" height="300" rx="8" fill="#1a1a19"/>
<circle cx="219" cy="25" r="5" fill="#3987e5"/>
<text x="230" y="29" font-size="12.5" fill="#f0efec">Olist orders</text>
<circle cx="369" cy="25" r="5" fill="#d95926"/>
<text x="380" y="29" font-size="12.5" fill="#f0efec">NYC taxi trips</text>
<text x="640" y="29" font-size="11" text-anchor="end" fill="#c3c2b7">lower is better</text>
<line x1="214.0" x2="214.0" y1="52" y2="252" stroke="#383835" stroke-width="1" stroke-dasharray="3 3"/>
<text x="214.0" y="268" font-size="11" text-anchor="middle" fill="#c3c2b7">0.5</text>
<line x1="335.7" x2="335.7" y1="52" y2="252" stroke="#383835" stroke-width="1"/>
<text x="335.7" y="268" font-size="11" text-anchor="middle" fill="#c3c2b7">0.6</text>
<line x1="457.4" x2="457.4" y1="52" y2="252" stroke="#383835" stroke-width="1"/>
<text x="457.4" y="268" font-size="11" text-anchor="middle" fill="#c3c2b7">0.7</text>
<line x1="579.1" x2="579.1" y1="52" y2="252" stroke="#383835" stroke-width="1"/>
<text x="579.1" y="268" font-size="11" text-anchor="middle" fill="#c3c2b7">0.8</text>
<text x="218.0" y="286" font-size="11" fill="#c3c2b7">0.5: a classifier cannot tell them from real rows</text>
<text x="200" y="74" font-size="12" text-anchor="end" fill="#f0efec">Misata, declared schema</text>
<text x="200" y="88" font-size="10.5" text-anchor="end" fill="#c3c2b7">sees no real data</text>
<circle cx="371.0" cy="68" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="380.0" y="72" font-size="10.5" fill="#c3c2b7">0.63</text>
