<title id="t">The declarations Misata understands today</title>
<desc id="d">38 guarantees in three courses, 23 of them re-checked by DuckDB in the certificate. State, structure, time and texture: dag_edges, closures, graph_motifs, lifecycles, event_logs, processes, bitemporal, events, time_grids, no_overlap, capacity, late_arrivals, degradations, vocabularies, noise; Exact counts and sums: outcome_curves, rate_curves, group_shares, joint_distributions, waterfalls, stock_flows, constraints, missingness, duplicates, typos, outliers, retention; Keys, rules and relationships: foreign keys, unique keys, NOT NULL, CHECK rules, min_children, partition_by, balanced_ledger, lte_parent, sum_lte_parent, temporal eligibility, parent_end. Above them, an open course for the next declaration.</desc>
